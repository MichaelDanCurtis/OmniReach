[workspace]
resolver = "2"
members = ["crates/protocol", "crates/host"]
# The Tauri app lives inside this directory tree but is built by the Tauri CLI
# with its own lockfile and profile. Without this exclusion cargo refuses to
# build it at all ("file found to be present in multiple build targets"), and
# the desktop app cannot be produced.
exclude = ["client/src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.24", features = ["v4", "serde"] }
tokio = { version = "1.53", features = ["full"] }
