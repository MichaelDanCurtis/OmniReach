[workspace]
resolver = "2"
members = ["crates/protocol", "crates/host"]

[workspace.package]
edition = "2021"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.24", features = ["v4", "serde"] }
tokio = { version = "1.53", features = ["full"] }
